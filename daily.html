<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="每日塔罗指引 - 月影决策屋">
    <meta name="theme-color" content="#0a0612">
    <title>每日塔罗 · 月影决策屋</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <style>
        .daily-container {
            position: relative; z-index: 10;
            max-width: 800px; margin: 0 auto;
            padding: var(--space-2xl) var(--space-xl);
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center;
        }

        .daily-header {
            text-align: center; margin-bottom: var(--space-2xl);
        }

        .daily-title {
            font-family: var(--font-display);
            color: var(--color-gold);
            font-size: 2rem;
            margin-bottom: var(--space-sm);
        }

        .daily-subtitle {
            color: var(--color-text-muted);
            font-size: 0.95rem;
        }

        .streak-card {
            display: flex; gap: var(--space-xl);
            background: var(--color-bg-card);
            border: 1px solid var(--color-purple-dark);
            border-radius: var(--radius-xl);
            padding: var(--space-lg) var(--space-xl);
            margin-bottom: var(--space-xl);
            width: 100%;
            justify-content: center;
        }

        .streak-item {
            text-align: center;
        }

        .streak-label {
            color: var(--color-text-muted);
            font-size: 0.85rem;
            margin-bottom: var(--space-xs);
        }

        .streak-value {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--color-gold);
        }

        .streak-value.max {
            color: var(--color-starlight);
        }

        .quote-card {
            background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(212,168,67,0.05));
            border: 1px solid var(--color-purple-dark);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            margin-bottom: var(--space-xl);
            width: 100%;
            text-align: center;
        }

        .daily-quote {
            font-size: 1.1rem;
            color: var(--color-text);
            font-style: italic;
            line-height: 1.8;
        }

        .quote-emoji {
            font-size: 1.5rem;
            margin-right: var(--space-sm);
        }

        .quote-text {
            vertical-align: middle;
        }

        .draw-area {
            display: flex; flex-direction: column;
            align-items: center;
            gap: var(--space-xl);
            margin-bottom: var(--space-xl);
        }

        .draw-btn {
            padding: var(--space-lg) var(--space-3xl);
            background: linear-gradient(135deg, var(--color-gold-dark), var(--color-gold));
            border: none; border-radius: var(--radius-full);
            color: var(--color-bg-deep);
            font-size: 1.2rem; font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer; transition: all 0.3s;
            box-shadow: var(--shadow-gold-glow);
        }

        .draw-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 0 30px rgba(212,168,67,0.5);
        }

        .draw-btn:disabled {
            opacity: 0.7; cursor: not-allowed;
        }

        .draw-btn.hidden, .hidden {
            display: none;
        }

        .tomorrow-hint {
            color: var(--color-text-muted);
            font-size: 0.9rem;
            font-style: italic;
            text-align: center;
        }

        .card-result {
            display: flex; flex-direction: column;
            align-items: center;
            gap: var(--space-xl);
            width: 100%;
        }

        .daily-card-wrapper {
            width: 200px; height: 300px;
            perspective: 1000px;
        }

        .daily-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 1s cubic-bezier(0.4,0,0.2,1);
            transform-style: preserve-3d;
        }

        .daily-card.revealed .daily-card-inner {
            transform: rotateY(180deg);
        }

        .daily-card-front, .daily-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .daily-card-back {
            background: linear-gradient(135deg, #0d0520, #1a0a35, #2d1555, #1a0a35, #0d0520);
            border: 2px solid var(--color-purple-dark);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        .daily-card-back .card-back-pattern {
            position: absolute; inset: 8px;
            border: 1px solid var(--color-gold-dark);
            border-radius: var(--radius-sm);
            opacity: 0.3;
        }

        .daily-card-back-symbol {
            font-size: 2.5rem;
            color: var(--color-gold);
        }

        .daily-card-back-text {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-top: var(--space-sm);
        }

        .daily-card-front {
            transform: rotateY(180deg);
            background: linear-gradient(180deg, rgba(26,5,37,0.96), rgba(45,27,78,0.96));
            border: 2px solid var(--color-gold);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 8px;
            box-shadow: var(--shadow-gold-glow);
        }

        .daily-card-frame {
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            width: 100%; height: 100%;
            border: 1px solid rgba(212,168,67,0.3);
            border-radius: var(--radius-sm);
            padding: 6px;
            gap: 4px;
        }

        .daily-card-image-wrap {
            width: 100%; flex: 1; min-height: 0;
            border-radius: 4px; overflow: hidden;
            background: linear-gradient(180deg, #efe1b5, #c9a86b);
        }

        .daily-card-image {
            display: block; width: 100%; height: 100%;
            object-fit: contain;
        }

        .daily-card-image.reversed {
            transform: rotate(180deg);
        }

        .daily-card-meta {
            display: flex; flex-direction: column;
            align-items: center; gap: 2px;
            width: 100%;
        }

        .card-name {
            font-size: 1rem;
            color: var(--color-gold-light);
            font-weight: 600;
        }

        .card-orientation {
            font-size: 0.75rem;
            color: var(--color-accent-teal);
            padding: 2px 10px;
            background: rgba(45,212,191,0.1);
            border-radius: var(--radius-full);
        }

        .card-orientation.reversed {
            color: #ef4444;
            background: rgba(239,68,68,0.1);
        }

        .reading-section {
            background: var(--color-bg-card);
            border: 1px solid var(--color-purple-dark);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            margin-bottom: var(--space-lg);
            width: 100%;
        }

        .reading-section h3 {
            color: var(--color-gold);
            font-size: 1.1rem;
            margin-bottom: var(--space-md);
            font-family: var(--font-display);
        }

        .reading-section p {
            color: var(--color-text);
            line-height: 2;
            font-size: 0.95rem;
        }

        .keywords {
            display: flex; flex-wrap: wrap;
            gap: var(--space-sm);
        }

        .keyword {
            padding: var(--space-xs) var(--space-md);
            background: rgba(139,92,246,0.2);
            border: 1px solid var(--color-purple-dark);
            border-radius: var(--radius-full);
            color: var(--color-starlight);
            font-size: 0.85rem;
        }

        .ai-reading-section {
            background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(45,212,191,0.05));
            border: 1px solid var(--color-purple-dark);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            margin-top: var(--space-lg);
            width: 100%;
        }

        .ai-reading-section h3 {
            color: var(--color-accent-teal);
            font-size: 1.1rem;
            margin-bottom: var(--space-md);
            font-family: var(--font-display);
        }

        .ai-reading-content {
            color: var(--color-text);
            line-height: 2;
            font-size: 0.95rem;
        }

        .ai-reading-content strong {
            color: var(--color-gold);
        }

        .ai-reading-content em {
            color: var(--color-starlight);
        }

        .ai-btn {
            padding: var(--space-md) var(--space-2xl);
            background: linear-gradient(135deg, var(--color-purple-dark), var(--color-purple-medium));
            border: 1px solid var(--color-purple-light);
            border-radius: var(--radius-full);
            color: var(--color-text);
            font-size: 0.95rem;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.3s;
            margin-top: var(--space-md);
        }

        .ai-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .ai-btn:disabled {
            opacity: 0.7; cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .daily-container {
                padding: var(--space-xl) var(--space-md);
            }

            .daily-title {
                font-size: 1.5rem;
            }

            .streak-card {
                gap: var(--space-lg);
                padding: var(--space-md) var(--space-lg);
            }

            .streak-value {
                font-size: 1.5rem;
            }

            .daily-card-wrapper {
                width: 150px; height: 225px;
            }

            .quote-card {
                padding: var(--space-lg);
            }

            .daily-quote {
                font-size: 1rem;
            }

            .draw-btn {
                padding: var(--space-md) var(--space-2xl);
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <noscript><div style="text-align:center;padding:4rem;color:#d4a843;font-family:serif;"><h2>✨ 月影决策屋</h2><p>需要JavaScript才能运行</p></div></noscript>
    <div class="stars-container" id="starsContainer"></div>
    <div class="moon"></div>

    <a href="index.html" class="back-home">← 返回首页</a>

    <div class="daily-container">
        <header class="daily-header">
            <h1 class="daily-title">✨ 每日塔罗</h1>
            <p class="daily-subtitle">今日的命运指引，等待你的开启</p>
        </header>

        <div class="streak-card">
            <div class="streak-item">
                <div class="streak-label">连续打卡</div>
                <div class="streak-value" id="streakCount">1</div>
            </div>
            <div class="streak-item">
                <div class="streak-label">历史最高</div>
                <div class="streak-value max" id="maxStreak">1</div>
            </div>
        </div>

        <div class="quote-card">
            <div class="daily-quote" id="dailyQuote"></div>
        </div>

        <div class="draw-area">
            <button class="draw-btn" id="drawCardBtn">✨ 抽取今日塔罗</button>

            <div class="daily-card-wrapper" id="dailyCard">
                <div class="daily-card-inner">
                    <div class="daily-card-back">
                        <div class="card-back-pattern"></div>
                        <span class="daily-card-back-symbol">✦</span>
                        <span class="daily-card-back-text">命运之牌</span>
                    </div>
                    <div class="daily-card-front">
                        <div class="daily-card-frame">
                            <div class="daily-card-image-wrap">
                                <img class="daily-card-image" id="cardImage" alt="塔罗牌" loading="lazy">
                            </div>
                            <div class="daily-card-meta">
                                <span class="card-name" id="cardName"></span>
                                <span class="card-orientation" id="cardOrientation"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tomorrow-hint hidden" id="tomorrowHint">
                今日牌已抽取，明日再来 ✨
            </div>
        </div>

        <div class="card-result hidden" id="cardResult">
            <div id="cardReading"></div>

            <button class="ai-btn hidden" id="aiReadingBtn">✨ AI深度解读</button>
            
            <div class="ai-reading-section hidden" id="aiReading"></div>
        </div>
    </div>

    <script type="module" src="/js/daily/app.js"></script>
</body>
</html>
