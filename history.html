<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="历史记录 - 月影决策屋">
    <meta name="theme-color" content="#0a0612">
    <title>历史记录 · 月影决策屋</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <style>
        .history-container {
            position: relative; z-index: 10;
            max-width: 800px; margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
            min-height: 100vh;
            padding-top: calc(var(--space-2xl) + 60px);
        }

        .history-header {
            text-align: center; margin-bottom: var(--space-2xl);
            animation: fadeInDown 0.8s ease-out;
        }

        .history-title {
            font-family: var(--font-display);
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--color-gold-light) 0%, var(--color-gold) 50%, var(--color-gold-dark) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.1em;
        }

        .history-subtitle {
            color: var(--color-text-muted); font-size: 0.95rem;
            margin-top: var(--space-sm); font-style: italic;
        }

        .filter-bar {
            display: flex; align-items: center; justify-content: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: var(--space-sm) var(--space-lg);
            background: rgba(139,92,246,0.1);
            border: 1px solid var(--color-purple-dark);
            border-radius: var(--radius-full);
            color: var(--color-text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-body);
        }

        .filter-tab:hover {
            background: rgba(139,92,246,0.2);
            border-color: var(--color-purple-medium);
            color: var(--color-starlight);
        }

        .filter-tab.active {
            background: linear-gradient(135deg, var(--color-purple-medium) 0%, var(--color-purple-light) 100%);
            border-color: var(--color-purple-glow);
            color: var(--color-text);
            box-shadow: var(--shadow-glow);
        }

        .filter-actions {
            margin-left: auto;
        }

        .clear-btn {
            padding: var(--space-sm) var(--space-md);
            background: transparent;
            border: 1px solid var(--color-accent-rose);
            border-radius: var(--radius-full);
            color: var(--color-accent-rose);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: rgba(244,63,94,0.1);
            border-color: var(--color-accent-rose);
        }

        .records-list {
            display: flex; flex-direction: column;
            gap: var(--space-md);
        }

        .record-card {
            display: flex; align-items: center;
            padding: var(--space-lg);
            background: linear-gradient(135deg, var(--color-bg-dark) 0%, var(--color-bg-medium) 100%);
            border: 1px solid var(--color-purple-dark);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.3s ease;
            gap: var(--space-md);
        }

        .record-card:hover {
            border-color: var(--color-purple-medium);
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }

        .record-icon {
            width: 48px; height: 48px;
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .record-info {
            flex: 1; min-width: 0;
        }

        .record-type {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-bottom: 2px;
        }

        .record-summary {
            font-size: 0.95rem;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .record-time {
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        .record-actions {
            display: flex; align-items: center;
            gap: var(--space-sm);
            flex-shrink: 0;
        }

        .share-btn, .delete-btn {
            width: 36px; height: 36px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-purple-dark);
            background: rgba(139,92,246,0.05);
            color: var(--color-text-muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .share-btn:hover {
            background: rgba(139,92,246,0.2);
            border-color: var(--color-purple-light);
            color: var(--color-starlight);
        }

        .delete-btn:hover {
            background: rgba(244,63,94,0.1);
            border-color: var(--color-accent-rose);
            color: var(--color-accent-rose);
        }

        .empty-state {
            text-align: center;
            padding: var(--space-3xl) var(--space-xl);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: var(--space-lg);
            opacity: 0.5;
        }

        .empty-text {
            font-size: 1.1rem;
            color: var(--color-text);
            margin-bottom: var(--space-sm);
        }

        .empty-hint {
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        .back-home {
            position: fixed; top: var(--space-lg); left: var(--space-lg);
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 100;
            display: flex; align-items: center;
            gap: 4px;
            padding: var(--space-sm) var(--space-md);
            background: rgba(10,6,18,0.8);
            border-radius: var(--radius-full);
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .back-home:hover {
            color: var(--color-gold);
            background: rgba(139,92,246,0.1);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10,6,18,0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 90%; max-width: 600px;
            max-height: 85vh;
            background: var(--color-bg-card);
            border: 1px solid var(--color-purple-dark);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            overflow-y: auto;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute; top: var(--space-md); right: var(--space-md);
            width: 36px; height: 36px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-purple-dark);
            background: transparent;
            color: var(--color-text-muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(244,63,94,0.1);
            border-color: var(--color-accent-rose);
            color: var(--color-accent-rose);
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--color-gold);
            text-align: center;
            margin-bottom: var(--space-lg);
        }

        .detail-header {
            text-align: center;
            margin-bottom: var(--space-xl);
            padding-bottom: var(--space-xl);
            border-bottom: 1px solid var(--color-purple-dark);
        }

        .detail-type {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: var(--space-sm);
        }

        .detail-time {
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .detail-section {
            margin-bottom: var(--space-xl);
        }

        .detail-section h3 {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--color-gold);
            margin-bottom: var(--space-md);
            letter-spacing: 0.05em;
        }

        .detail-section p {
            color: var(--color-text);
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .tarot-detail-cards {
            display: flex; flex-direction: column;
            gap: var(--space-lg);
        }

        .tarot-detail-card {
            display: flex;
            gap: var(--space-md);
            padding: var(--space-md);
            background: rgba(139,92,246,0.05);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-purple-dark);
        }

        .tarot-detail-image-wrap {
            width: 100px; flex-shrink: 0;
        }

        .tarot-detail-image-wrap img {
            width: 100%;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-purple-dark);
        }

        .tarot-detail-image-wrap img.reversed {
            transform: rotate(180deg);
        }

        .tarot-detail-info {
            flex: 1;
        }

        .tarot-detail-position {
            font-size: 0.8rem;
            color: var(--color-accent-teal);
            margin-bottom: 4px;
        }

        .tarot-detail-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 4px;
        }

        .tarot-detail-orientation {
            font-size: 0.85rem;
            color: var(--color-gold);
            margin-bottom: var(--space-sm);
        }

        .tarot-detail-orientation.reversed {
            color: var(--color-accent-rose);
        }

        .tarot-detail-meaning {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            line-height: 1.6;
        }

        .detail-reading {
            color: var(--color-text);
            line-height: 1.8;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .daily-detail-card {
            display: flex; flex-direction: column;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-md);
            background: rgba(139,92,246,0.05);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-purple-dark);
        }

        .daily-detail-image-wrap {
            width: 140px;
        }

        .daily-detail-image-wrap img {
            width: 100%;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-purple-dark);
        }

        .daily-detail-info {
            text-align: center;
        }

        .daily-detail-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 4px;
        }

        .daily-detail-orientation {
            font-size: 0.9rem;
            color: var(--color-gold);
        }

        .detail-quote {
            padding: var(--space-lg);
            background: linear-gradient(135deg, rgba(139,92,246,0.1) 0%, rgba(139,92,246,0.05) 100%);
            border-radius: var(--radius-lg);
            border-left: 3px solid var(--color-purple-glow);
            color: var(--color-starlight);
            font-style: italic;
            line-height: 1.8;
            font-size: 1rem;
        }

        .share-canvas-container {
            display: flex; flex-direction: column;
            align-items: center;
            gap: var(--space-lg);
        }

        #shareCanvas {
            max-width: 100%;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 2px solid var(--color-gold);
        }

        .share-actions {
            display: flex; gap: var(--space-md);
        }

        .share-btn-primary {
            padding: var(--space-md) var(--space-xl);
            background: linear-gradient(135deg, var(--color-purple-medium) 0%, var(--color-purple-light) 100%);
            border: none;
            border-radius: var(--radius-md);
            color: var(--color-text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-body);
        }

        .share-btn-primary:hover {
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .history-container {
                padding: var(--space-lg) var(--space-md);
                padding-top: calc(var(--space-xl) + 60px);
            }

            .history-title {
                font-size: 1.6rem;
            }

            .record-card {
                padding: var(--space-md);
                flex-wrap: wrap;
            }

            .record-info {
                width: calc(100% - 60px);
            }

            .record-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .tarot-detail-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .tarot-detail-image-wrap {
                width: 120px;
            }

            .filter-actions {
                width: 100%;
                text-align: center;
                margin-top: var(--space-sm);
            }

            .modal-content {
                width: 95%;
                padding: var(--space-lg);
            }
        }
    </style>
</head>
<body>
    <noscript><div style="text-align:center;padding:4rem;color:#d4a843;font-family:serif;"><h2>📜 月影决策屋</h2><p>需要JavaScript才能运行</p></div></noscript>
    <div class="stars-container" id="starsContainer"></div>
    <div class="moon"></div>

    <a href="index.html" class="back-home">← 返回首页</a>

    <div class="history-container">
        <header class="history-header">
            <h1 class="history-title">📜 历史记录</h1>
            <p class="history-subtitle">记录每一次命运的指引</p>
        </header>

        <div class="filter-bar">
            <button class="filter-tab active" data-filter="all">全部</button>
            <button class="filter-tab" data-filter="tarot">🔮 塔罗</button>
            <button class="filter-tab" data-filter="quick">✨ 快占</button>
            <button class="filter-tab" data-filter="daily">🌙 每日</button>
            <div class="filter-actions">
                <button class="clear-btn" id="clearAllBtn">清空全部</button>
            </div>
        </div>

        <div class="records-list" id="recordsList"></div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" id="closeDetailBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div id="detailContent"></div>
        </div>
    </div>

    <div class="modal-overlay" id="shareModal">
        <div class="modal-content">
            <button class="modal-close" id="closeShareBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 class="modal-title">✨ 分享卡片</h2>
            <div class="share-canvas-container">
                <canvas id="shareCanvas"></canvas>
                <div class="share-actions">
                    <button class="share-btn-primary" id="downloadShareBtn">📥 下载卡片</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/history/app.js"></script>
</body>
</html>
